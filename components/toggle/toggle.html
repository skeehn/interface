<!-- skeehn — Toggle Component -->

<!-- Toggle off -->
<label class="sk-toggle">
  <input class="sk-toggle__input" type="checkbox" role="switch" aria-checked="false">
  <span class="sk-toggle__thumb"></span>
  <span class="sk-toggle__label">Dark mode</span>
</label>

<!-- Toggle on -->
<label class="sk-toggle">
  <input class="sk-toggle__input" type="checkbox" role="switch" aria-checked="true" checked>
  <span class="sk-toggle__thumb"></span>
  <span class="sk-toggle__label">Notifications</span>
</label>

<!-- Toggle off (another example) -->
<label class="sk-toggle">
  <input class="sk-toggle__input" type="checkbox" role="switch" aria-checked="false">
  <span class="sk-toggle__thumb"></span>
  <span class="sk-toggle__label">Auto-save</span>
</label>

<!-- Toggle on (another example) -->
<label class="sk-toggle">
  <input class="sk-toggle__input" type="checkbox" role="switch" aria-checked="true" checked>
  <span class="sk-toggle__thumb"></span>
  <span class="sk-toggle__label">Dither effects</span>
</label>

<!-- Disabled toggle (off) -->
<label class="sk-toggle" style="opacity: 0.5; pointer-events: none;">
  <input class="sk-toggle__input" type="checkbox" role="switch" aria-checked="false" disabled>
  <span class="sk-toggle__thumb"></span>
  <span class="sk-toggle__label">Locked setting</span>
</label>

<!-- Disabled toggle (on) -->
<label class="sk-toggle" style="opacity: 0.5; pointer-events: none;">
  <input class="sk-toggle__input" type="checkbox" role="switch" aria-checked="true" checked disabled>
  <span class="sk-toggle__thumb"></span>
  <span class="sk-toggle__label">Always on</span>
</label>

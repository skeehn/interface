<!-- skeehn — Voice Session Component -->

<!-- Idle state -->
<section class="sk-voice-session" data-status="idle" data-timezone="Asia/Tokyo" data-city="Tokyo">
  <div class="sk-voice-session__clock" data-city="Tokyo">Tokyo 00:00:00</div>
  <div class="sk-voice-session__waveform" aria-hidden="true">
    <div class="sk-voice-session__waveform-bar" style="height:10%"></div>
    <div class="sk-voice-session__waveform-bar" style="height:10%"></div>
    <div class="sk-voice-session__waveform-bar" style="height:10%"></div>
    <div class="sk-voice-session__waveform-bar" style="height:10%"></div>
    <div class="sk-voice-session__waveform-bar" style="height:10%"></div>
    <div class="sk-voice-session__waveform-bar" style="height:10%"></div>
    <div class="sk-voice-session__waveform-bar" style="height:10%"></div>
    <div class="sk-voice-session__waveform-bar" style="height:10%"></div>
  </div>
  <div class="sk-voice-session__transcript" role="log" aria-live="polite" aria-label="Voice transcript">
    <div class="sk-voice-session__turn" data-role="assistant">Session ready. Say something to begin.</div>
  </div>
  <div class="sk-voice-session__controls">
    <button class="sk-btn" data-variant="outline" data-action="mute" aria-label="Mute microphone">Mute</button>
    <button class="sk-btn" data-variant="ghost" data-action="end" aria-label="End session">End</button>
  </div>
</section>

<!-- Listening state -->
<section class="sk-voice-session" data-status="listening" data-timezone="America/New_York" data-city="New York">
  <div class="sk-voice-session__clock" data-city="New York">New York 00:00:00</div>
  <div class="sk-voice-session__waveform" aria-hidden="true">
    <div class="sk-voice-session__waveform-bar" style="height:60%"></div>
    <div class="sk-voice-session__waveform-bar" style="height:80%"></div>
    <div class="sk-voice-session__waveform-bar" style="height:40%"></div>
    <div class="sk-voice-session__waveform-bar" style="height:90%"></div>
    <div class="sk-voice-session__waveform-bar" style="height:50%"></div>
    <div class="sk-voice-session__waveform-bar" style="height:70%"></div>
    <div class="sk-voice-session__waveform-bar" style="height:30%"></div>
    <div class="sk-voice-session__waveform-bar" style="height:55%"></div>
  </div>
  <div class="sk-voice-session__transcript" role="log" aria-live="polite" aria-label="Voice transcript">
    <div class="sk-voice-session__turn" data-role="user">What's the weather like today?</div>
    <div class="sk-voice-session__turn" data-role="assistant">Currently listening…</div>
  </div>
  <div class="sk-voice-session__controls">
    <button class="sk-btn" data-variant="solid" data-action="mute" aria-label="Mute microphone">Mute</button>
    <button class="sk-btn" data-variant="ghost" data-action="end" aria-label="End session">End</button>
  </div>
</section>

<!-- Speaking state -->
<section class="sk-voice-session" data-status="speaking" data-timezone="Europe/London" data-city="London">
  <div class="sk-voice-session__clock" data-city="London">London 00:00:00</div>
  <div class="sk-voice-session__waveform" aria-hidden="true">
    <div class="sk-voice-session__waveform-bar" style="height:75%"></div>
    <div class="sk-voice-session__waveform-bar" style="height:85%"></div>
    <div class="sk-voice-session__waveform-bar" style="height:65%"></div>
    <div class="sk-voice-session__waveform-bar" style="height:95%"></div>
    <div class="sk-voice-session__waveform-bar" style="height:55%"></div>
    <div class="sk-voice-session__waveform-bar" style="height:80%"></div>
    <div class="sk-voice-session__waveform-bar" style="height:70%"></div>
    <div class="sk-voice-session__waveform-bar" style="height:60%"></div>
  </div>
  <div class="sk-voice-session__transcript" role="log" aria-live="polite" aria-label="Voice transcript">
    <div class="sk-voice-session__turn" data-role="user">What's the weather like today?</div>
    <div class="sk-voice-session__turn" data-role="assistant">It's currently 18°C and partly cloudy in London.</div>
  </div>
  <div class="sk-voice-session__controls">
    <button class="sk-btn" data-variant="outline" data-action="mute" aria-label="Mute microphone">Mute</button>
    <button class="sk-btn" data-variant="ghost" data-action="end" aria-label="End session">End</button>
  </div>
</section>

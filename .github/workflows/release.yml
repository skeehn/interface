name: Release

# Publishes all @skeehn/* packages in lockstep when a vX.Y.Z tag lands on v2/main.
# Requires repo secret NPM_TOKEN (automation token with publish rights for
# the @skeehn scope). Docs deploy stays on Vercel (vercel.json).

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: bun run build

      - name: Run tests
        run: bun test

      - name: Type check
        run: bunx tsc --noEmit && bunx tsc -p packages/react/tsconfig.json --noEmit

      - name: Tag matches package version
        run: |
          VERSION=$(node -p "require('./packages/react/package.json').version")
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != package version v$VERSION"; exit 1
          fi

  publish:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build dists
        run: bun run build

      - name: Publish @skeehn packages (lockstep)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for p in core react wc mcp-server; do
            if [ -n "$(npm view @skeehn/$p@$(node -p "require('./packages/$p/package.json').version") version 2>/dev/null)" ]; then
              echo "@skeehn/$p@$(node -p "require('./packages/$p/package.json').version") already published — skipping"
              continue
            fi
            cd "packages/$p"
            npm publish --access public --provenance
            cd "$GITHUB_WORKSPACE"
          done

      - name: Create GitHub release with notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --title "@skeehn v${GITHUB_REF_NAME#v}"

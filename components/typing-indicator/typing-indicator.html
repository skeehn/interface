<!-- skeehn — TypingIndicator Component -->

<!-- Default dots -->
<div class="sk-typing-indicator" role="status" aria-label="AI is typing">
  <div class="sk-typing-indicator__dots">
    <span class="sk-typing-indicator__dot"></span>
    <span class="sk-typing-indicator__dot"></span>
    <span class="sk-typing-indicator__dot"></span>
  </div>
  <span class="sk-typing-indicator__text">Typing...</span>
</div>

<!-- ASCII variant -->
<div class="sk-typing-indicator" data-variant="ascii" role="status" aria-label="AI is thinking">
  <div class="sk-typing-indicator__dots">
    <span class="sk-typing-indicator__dot"></span>
    <span class="sk-typing-indicator__dot"></span>
    <span class="sk-typing-indicator__dot"></span>
  </div>
  <span class="sk-typing-indicator__text">Thinking...</span>
</div>

<!-- Dither variant -->
<div class="sk-typing-indicator" data-variant="dither" role="status" aria-label="AI is generating">
  <div class="sk-typing-indicator__dots">
    <span class="sk-typing-indicator__dot"></span>
    <span class="sk-typing-indicator__dot"></span>
    <span class="sk-typing-indicator__dot"></span>
  </div>
  <span class="sk-typing-indicator__text">Generating...</span>
</div>

<!-- Compact -->
<div class="sk-typing-indicator" data-size="compact" role="status" aria-label="AI is typing">
  <div class="sk-typing-indicator__dots">
    <span class="sk-typing-indicator__dot"></span>
    <span class="sk-typing-indicator__dot"></span>
    <span class="sk-typing-indicator__dot"></span>
  </div>
</div>

<!-- skeehn — Button Component -->

<!-- Solid variant (sizes) -->
<button class="sk-btn" data-variant="solid" data-size="sm">Small</button>
<button class="sk-btn" data-variant="solid">Default</button>
<button class="sk-btn" data-variant="solid" data-size="lg">Large</button>
<button class="sk-btn" data-variant="solid" data-size="xl">Extra Large</button>

<!-- Dither variant -->
<button class="sk-btn" data-variant="dither" data-size="sm">Dither SM</button>
<button class="sk-btn" data-variant="dither">Dither</button>
<button class="sk-btn" data-variant="dither" data-size="lg">Dither LG</button>
<button class="sk-btn" data-variant="dither" data-size="xl">Dither XL</button>

<!-- Outline variant -->
<button class="sk-btn" data-variant="outline" data-size="sm">Outline SM</button>
<button class="sk-btn" data-variant="outline">Outline</button>
<button class="sk-btn" data-variant="outline" data-size="lg">Outline LG</button>
<button class="sk-btn" data-variant="outline" data-size="xl">Outline XL</button>

<!-- Ghost variant -->
<button class="sk-btn" data-variant="ghost" data-size="sm">Ghost SM</button>
<button class="sk-btn" data-variant="ghost">Ghost</button>
<button class="sk-btn" data-variant="ghost" data-size="lg">Ghost LG</button>
<button class="sk-btn" data-variant="ghost" data-size="xl">Ghost XL</button>

<!-- Inverted variant -->
<button class="sk-btn" data-variant="inverted" data-size="sm">Inverted SM</button>
<button class="sk-btn" data-variant="inverted">Inverted</button>
<button class="sk-btn" data-variant="inverted" data-size="lg">Inverted LG</button>
<button class="sk-btn" data-variant="inverted" data-size="xl">Inverted XL</button>

<!-- ASCII variant -->
<button class="sk-btn" data-variant="ascii" data-size="sm">ASCII SM</button>
<button class="sk-btn" data-variant="ascii">ASCII</button>
<button class="sk-btn" data-variant="ascii" data-size="lg">ASCII LG</button>
<button class="sk-btn" data-variant="ascii" data-size="xl">ASCII XL</button>

<!-- Disabled state -->
<button class="sk-btn" data-variant="solid" disabled aria-disabled="true">Disabled Solid</button>
<button class="sk-btn" data-variant="dither" disabled aria-disabled="true">Disabled Dither</button>
<button class="sk-btn" data-variant="outline" disabled aria-disabled="true">Disabled Outline</button>
<button class="sk-btn" data-variant="ghost" disabled aria-disabled="true">Disabled Ghost</button>
<button class="sk-btn" data-variant="inverted" disabled aria-disabled="true">Disabled Inverted</button>
<button class="sk-btn" data-variant="ascii" disabled aria-disabled="true">Disabled ASCII</button>

<!-- skeehn — Dropdown Component -->

<!-- Dropdown (closed) -->
<div class="sk-dropdown">
  <button class="sk-btn" data-variant="outline" data-size="sm" data-dropdown-trigger aria-haspopup="menu" aria-expanded="false">Actions ▾</button>
  <div class="sk-dropdown__content" role="menu">
    <div class="sk-dropdown__item" role="menuitem">Edit</div>
    <div class="sk-dropdown__item" role="menuitem">Duplicate</div>
    <div class="sk-dropdown__item" role="menuitem">Share</div>
    <div class="sk-dropdown__separator"></div>
    <div class="sk-dropdown__item sk-dropdown__item--destructive" role="menuitem">Delete</div>
  </div>
</div>

<!-- Dropdown (open) -->
<div class="sk-dropdown">
  <button class="sk-btn" data-variant="outline" data-size="sm" data-dropdown-trigger aria-haspopup="menu" aria-expanded="true">Options ▾</button>
  <div class="sk-dropdown__content" data-open role="menu">
    <div class="sk-dropdown__item" role="menuitem">New file</div>
    <div class="sk-dropdown__item" role="menuitem">Open project</div>
    <div class="sk-dropdown__item" role="menuitem">Save as…</div>
    <div class="sk-dropdown__separator"></div>
    <div class="sk-dropdown__item" role="menuitem">Settings</div>
    <div class="sk-dropdown__separator"></div>
    <div class="sk-dropdown__item sk-dropdown__item--destructive" role="menuitem">Close project</div>
  </div>
</div>

<!-- Dropdown with fewer items (closed) -->
<div class="sk-dropdown">
  <button class="sk-btn" data-variant="ghost" data-size="sm" data-dropdown-trigger aria-haspopup="menu" aria-expanded="false">Sort ▾</button>
  <div class="sk-dropdown__content" role="menu">
    <div class="sk-dropdown__item" role="menuitem">Name</div>
    <div class="sk-dropdown__item" role="menuitem">Date modified</div>
    <div class="sk-dropdown__item" role="menuitem">Size</div>
  </div>
</div>

<!-- skeehn — Badge Component -->

<!-- Solid variant -->
<span class="sk-badge" data-variant="solid">Solid</span>

<!-- Dither variant -->
<span class="sk-badge" data-variant="dither">Dither</span>

<!-- Outline variant -->
<span class="sk-badge" data-variant="outline">Outline</span>

<!-- Ghost variant -->
<span class="sk-badge" data-variant="ghost">Ghost</span>

<!-- Inverted variant -->
<span class="sk-badge" data-variant="inverted">Inverted</span>

<!-- Color: success -->
<span class="sk-badge" data-variant="solid" data-color="success">Success</span>
<span class="sk-badge" data-variant="dither" data-color="success">Success</span>
<span class="sk-badge" data-variant="outline" data-color="success">Success</span>

<!-- Color: warning -->
<span class="sk-badge" data-variant="solid" data-color="warning">Warning</span>
<span class="sk-badge" data-variant="dither" data-color="warning">Warning</span>
<span class="sk-badge" data-variant="outline" data-color="warning">Warning</span>

<!-- Color: destructive -->
<span class="sk-badge" data-variant="solid" data-color="destructive">Destructive</span>
<span class="sk-badge" data-variant="dither" data-color="destructive">Destructive</span>
<span class="sk-badge" data-variant="outline" data-color="destructive">Destructive</span>

<!-- Color: info -->
<span class="sk-badge" data-variant="solid" data-color="info">Info</span>
<span class="sk-badge" data-variant="dither" data-color="info">Info</span>
<span class="sk-badge" data-variant="outline" data-color="info">Info</span>

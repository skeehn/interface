<!-- skeehn — Avatar Component -->

<!-- Avatar with image (all sizes) -->
<span class="sk-avatar" data-size="xs" aria-label="User avatar">
  <img src="avatar.jpg" alt="User">
</span>

<span class="sk-avatar" data-size="sm" aria-label="User avatar">
  <img src="avatar.jpg" alt="User">
</span>

<span class="sk-avatar" data-size="md" aria-label="User avatar">
  <img src="avatar.jpg" alt="User">
</span>

<span class="sk-avatar" data-size="lg" aria-label="User avatar">
  <img src="avatar.jpg" alt="User">
</span>

<span class="sk-avatar" data-size="xl" aria-label="User avatar">
  <img src="avatar.jpg" alt="User">
</span>

<!-- Avatar with fallback initials (all sizes) -->
<span class="sk-avatar" data-size="xs" aria-label="John Doe">
  <span class="sk-avatar__fallback">JD</span>
</span>

<span class="sk-avatar" data-size="sm" aria-label="John Doe">
  <span class="sk-avatar__fallback">JD</span>
</span>

<span class="sk-avatar" data-size="md" aria-label="John Doe">
  <span class="sk-avatar__fallback">JD</span>
</span>

<span class="sk-avatar" data-size="lg" aria-label="John Doe">
  <span class="sk-avatar__fallback">JD</span>
</span>

<span class="sk-avatar" data-size="xl" aria-label="John Doe">
  <span class="sk-avatar__fallback">JD</span>
</span>

<!-- Single character fallback -->
<span class="sk-avatar" data-size="md" aria-label="Alice">
  <span class="sk-avatar__fallback">A</span>
</span>

<!-- skeehn — DataViz Component -->

<!-- ASCII Bar Chart -->

    <div class="sk-ascii-chart__bar">
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--filled">█</div>
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--filled">█</div>
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--filled">█</div>
    </div>
    <div class="sk-ascii-chart__bar">
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--filled">█</div>
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--filled">█</div>
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--filled">█</div>
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--filled">█</div>
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--filled">█</div>
    </div>
    <div class="sk-ascii-chart__bar">
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--filled">█</div>
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--filled">█</div>
    </div>
    <div class="sk-ascii-chart__bar">
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--filled">█</div>
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--filled">█</div>
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--filled">█</div>
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--filled">█</div>
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--filled">█</div>
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--filled">█</div>
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--filled">█</div>
    </div>
    <div class="sk-ascii-chart__bar">
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--filled">█</div>
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--filled">█</div>
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--filled">█</div>
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--filled">█</div>

    <div class="sk-ascii-chart__label-cell">W</div>
    <div class="sk-ascii-chart__label-cell">T</div>
    <div class="sk-ascii-chart__label-cell">F</div>
  </div>
</div>

<!-- ASCII Bar Chart with dither cells -->
<div class="sk-ascii-chart" role="img" aria-label="Dithered bar chart: A 4, B 6, C 2">
  <div class="sk-ascii-chart__row">
    <div class="sk-ascii-chart__bar">
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--dither">░</div>
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--dither">░</div>
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--dither">░</div>
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--dither">░</div>
    </div>
    <div class="sk-ascii-chart__bar">
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--dither">░</div>
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--dither">░</div>
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--dither">░</div>
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--dither">░</div>
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--dither">░</div>
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--dither">░</div>
    </div>
    <div class="sk-ascii-chart__bar">
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--dither">░</div>
      <div class="sk-ascii-chart__bar-cell sk-ascii-chart__bar-cell--dither">░</div>
    </div>
  </div>
  <div class="sk-ascii-chart__label">

    <div class="sk-ascii-chart__label-cell">B</div>
    <div class="sk-ascii-chart__label-cell">C</div>
  </div>
</div>

<!-- Sparkline -->
<span class="sk-sparkline" role="img" aria-label="Sparkline showing recent trend: 40%, 60%, 30%, 80%, 50%, 70%, 90%, 45%">
  <span class="sk-sparkline__bar" style="height: 40%"></span>
  <span class="sk-sparkline__bar" style="height: 60%"></span>
  <span class="sk-sparkline__bar" style="height: 30%"></span>
  <span class="sk-sparkline__bar" style="height: 80%"></span>
  <span class="sk-sparkline__bar" style="height: 50%"></span>
  <span class="sk-sparkline__bar" style="height: 70%"></span>
  <span class="sk-sparkline__bar" style="height: 90%"></span>
  <span class="sk-sparkline__bar" style="height: 45%"></span>
</span>

<!-- Sparkline with dither bars -->
<span class="sk-sparkline" role="img" aria-label="Dithered sparkline: 20%, 50%, 70%, 40%, 90%, 60%">
  <span class="sk-sparkline__bar sk-sparkline__bar--dither" style="height: 20%"></span>
  <span class="sk-sparkline__bar sk-sparkline__bar--dither" style="height: 50%"></span>
  <span class="sk-sparkline__bar sk-sparkline__bar--dither" style="height: 70%"></span>
  <span class="sk-sparkline__bar sk-sparkline__bar--dither" style="height: 40%"></span>
  <span class="sk-sparkline__bar sk-sparkline__bar--dither" style="height: 90%"></span>
  <span class="sk-sparkline__bar sk-sparkline__bar--dither" style="height: 60%"></span>
</span>

<!-- Meter (40%) -->
<div class="sk-meter" role="img" aria-label="CPU usage: 40%">
  <div class="sk-meter__track">
    <div class="sk-meter__fill" style="width: 40%"></div>
  </div>
  <span class="sk-meter__label">40%</span>
</div>

<!-- Meter (75%) -->
<div class="sk-meter" role="img" aria-label="Memory usage: 75%">
  <div class="sk-meter__track">
    <div class="sk-meter__fill" style="width: 75%"></div>
  </div>
  <span class="sk-meter__label">75%</span>
</div>

<!-- Meter with dither fill -->
<div class="sk-meter" role="img" aria-label="Disk usage: 60%">
  <div class="sk-meter__track">
    <div class="sk-meter__fill sk-meter__fill--dither" style="width: 60%"></div>
  </div>
  <span class="sk-meter__label">60%</span>
</div>

<!-- Heatmap (7×5 grid with varying levels) -->
<div class="sk-heatmap" role="img" aria-label="Activity heatmap for the past week" style="grid-template-columns: repeat(7, 1ch);">
  <div class="sk-heatmap__cell sk-heatmap__cell--0"></div>
  <div class="sk-heatmap__cell sk-heatmap__cell--1">░</div>
  <div class="sk-heatmap__cell sk-heatmap__cell--2">▒</div>
  <div class="sk-heatmap__cell sk-heatmap__cell--4">█</div>
  <div class="sk-heatmap__cell sk-heatmap__cell--3">▓</div>
  <div class="sk-heatmap__cell sk-heatmap__cell--1">░</div>
  <div class="sk-heatmap__cell sk-heatmap__cell--0"></div>
  <div class="sk-heatmap__cell sk-heatmap__cell--1">░</div>
  <div class="sk-heatmap__cell sk-heatmap__cell--3">▓</div>
  <div class="sk-heatmap__cell sk-heatmap__cell--4">█</div>
  <div class="sk-heatmap__cell sk-heatmap__cell--2">▒</div>
  <div class="sk-heatmap__cell sk-heatmap__cell--0"></div>
  <div class="sk-heatmap__cell sk-heatmap__cell--2">▒</div>
  <div class="sk-heatmap__cell sk-heatmap__cell--1">░</div>
  <div class="sk-heatmap__cell sk-heatmap__cell--2">▒</div>
  <div class="sk-heatmap__cell sk-heatmap__cell--0"></div>
  <div class="sk-heatmap__cell sk-heatmap__cell--1">░</div>
  <div class="sk-heatmap__cell sk-heatmap__cell--3">▓</div>
  <div class="sk-heatmap__cell sk-heatmap__cell--4">█</div>
  <div class="sk-heatmap__cell sk-heatmap__cell--4">█</div>
  <div class="sk-heatmap__cell sk-heatmap__cell--3">▓</div>
</div>

<!-- Heatmap with dither cells -->
<div class="sk-heatmap" role="img" aria-label="Dithered heatmap" style="grid-template-columns: repeat(5, 1ch);">
  <div class="sk-heatmap__cell sk-heatmap__cell--0 sk-heatmap__cell--dither"></div>
  <div class="sk-heatmap__cell sk-heatmap__cell--1 sk-heatmap__cell--dither">░</div>
  <div class="sk-heatmap__cell sk-heatmap__cell--2 sk-heatmap__cell--dither">▒</div>
  <div class="sk-heatmap__cell sk-heatmap__cell--3 sk-heatmap__cell--dither">▓</div>
  <div class="sk-heatmap__cell sk-heatmap__cell--4 sk-heatmap__cell--dither">█</div>
</div>

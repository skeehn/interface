<!-- skeehn — Tooltip Component -->

<!-- Tooltip on a button -->
<span class="sk-tooltip-wrapper">
  <button class="sk-btn" data-variant="outline" aria-describedby="tooltip-save">Save</button>
  <span class="sk-tooltip" id="tooltip-save" role="tooltip">Save changes (Ctrl+S)</span>
</span>

<!-- Tooltip on an icon/action button -->
<span class="sk-tooltip-wrapper">
  <button class="sk-btn" data-variant="ghost" data-size="sm" aria-label="Settings" aria-describedby="tooltip-settings">⚙</button>
  <span class="sk-tooltip" id="tooltip-settings" role="tooltip">Settings</span>
</span>

<!-- Tooltip on text -->
<span class="sk-tooltip-wrapper">
  <span tabindex="0" aria-describedby="tooltip-term">dither</span>
  <span class="sk-tooltip" id="tooltip-term" role="tooltip">ASCII texture rendering technique</span>
</span>

<!-- Tooltip on a badge -->
<span class="sk-tooltip-wrapper">
  <span class="sk-badge" data-variant="solid" data-color="success" aria-describedby="tooltip-status">Online</span>
  <span class="sk-tooltip" id="tooltip-status" role="tooltip">Connected since 10:32 AM</span>
</span>

<!-- skeehn — Progress Component -->

<!-- Default progress (25%) -->
<div class="sk-progress" role="progressbar" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" aria-label="Upload progress">
  <div class="sk-progress__track">
    <div class="sk-progress__indicator" style="width: 25%"></div>
  </div>
  <span class="sk-progress__label">25%</span>
</div>

<!-- Default progress (50%) -->
<div class="sk-progress" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100" aria-label="Processing">
  <div class="sk-progress__track">
    <div class="sk-progress__indicator" style="width: 50%"></div>
  </div>
  <span class="sk-progress__label">50%</span>
</div>

<!-- Default progress (100%) -->
<div class="sk-progress" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" aria-label="Complete">
  <div class="sk-progress__track">
    <div class="sk-progress__indicator" style="width: 100%"></div>
  </div>
  <span class="sk-progress__label">100%</span>
</div>

<!-- Dither variant (65%) -->
<div class="sk-progress" data-variant="dither" role="progressbar" aria-valuenow="65" aria-valuemin="0" aria-valuemax="100" aria-label="Download progress">
  <div class="sk-progress__track">
    <div class="sk-progress__indicator" style="width: 65%"></div>
  </div>
  <span class="sk-progress__label">65%</span>
</div>

<!-- Loading state (indeterminate) -->
<div class="sk-progress" data-state="loading" role="progressbar" aria-label="Loading">
  <div class="sk-progress__track">
    <div class="sk-progress__indicator" style="width: 100%"></div>
  </div>
</div>

<!-- Dither variant with loading state -->
<div class="sk-progress" data-variant="dither" data-state="loading" role="progressbar" aria-label="Processing">
  <div class="sk-progress__track">
    <div class="sk-progress__indicator" style="width: 100%"></div>
  </div>
</div>

<!-- Progress without label -->
<div class="sk-progress" role="progressbar" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100" aria-label="Step 2 of 5">
  <div class="sk-progress__track">
    <div class="sk-progress__indicator" style="width: 40%"></div>
  </div>
</div>

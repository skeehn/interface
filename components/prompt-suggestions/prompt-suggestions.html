<!-- skeehn — PromptSuggestions: starter prompts for empty AI chat -->

<!-- Default grid variant -->
<div class="sk-prompt-suggestions">
  <div class="sk-prompt-suggestions__label">Try asking</div>
  <div class="sk-prompt-suggestions__grid">
    <button class="sk-prompt-suggestion" data-prompt="Explain how dithering works in computer graphics">
      <span class="sk-prompt-suggestion__icon">▦</span>
      <span class="sk-prompt-suggestion__text">Explain how dithering works in computer graphics</span>
    </button>
    <button class="sk-prompt-suggestion" data-prompt="Build a chat UI with skeehn components">
      <span class="sk-prompt-suggestion__icon">◈</span>
      <span class="sk-prompt-suggestion__text">Build a chat UI with skeehn components</span>
    </button>
    <button class="sk-prompt-suggestion" data-prompt="Show me the ASCII engine API">
      <span class="sk-prompt-suggestion__icon">░</span>
      <span class="sk-prompt-suggestion__text">Show me the ASCII engine API</span>
    </button>
    <button class="sk-prompt-suggestion" data-prompt="Compare the brutal and terminal themes">
      <span class="sk-prompt-suggestion__icon">▒</span>
      <span class="sk-prompt-suggestion__text">Compare the brutal and terminal themes</span>
    </button>
  </div>
</div>

<!-- Chips variant -->
<div class="sk-prompt-suggestions" data-variant="chips">
  <div class="sk-prompt-suggestions__grid">
    <button class="sk-prompt-suggestion" data-prompt="How do I install skeehn?">How do I install skeehn?</button>
    <button class="sk-prompt-suggestion" data-prompt="Show all components">Show all components</button>
    <button class="sk-prompt-suggestion" data-prompt="Dark mode setup">Dark mode setup</button>
    <button class="sk-prompt-suggestion" data-prompt="CLI reference">CLI reference</button>
  </div>
</div>
